name: Safely extract uploaded ZIP

on:
  push:
    paths:
      - "Chess4.zip"
      - "imz.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: safe-zip-extract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract-and-commit:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and safely extract archive
        shell: bash
        run: |
          set -Eeuo pipefail

          ARCHIVE=""
          if [[ -f "Chess4.zip" ]]; then
            ARCHIVE="Chess4.zip"
          elif [[ -f "imz.zip" ]]; then
            ARCHIVE="imz.zip"
          else
            echo "No archive is present (the upload may already have been processed); nothing to do."
            exit 0
          fi
          echo "Selected archive: ${ARCHIVE}"

          python3 - "${ARCHIVE}" <<'PY'
          import stat
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path(sys.argv[1])
          root = Path.cwd().resolve()
          max_members = 20_000
          max_uncompressed = 2 * 1024 * 1024 * 1024

          with zipfile.ZipFile(archive) as zf:
              members = zf.infolist()
              if len(members) > max_members:
                  raise SystemExit(f"Archive has too many entries: {len(members)}")

              total_size = sum(info.file_size for info in members)
              if total_size > max_uncompressed:
                  raise SystemExit(
                      f"Archive expands beyond 2 GiB: {total_size} uncompressed bytes"
                  )

              for info in members:
                  raw_name = info.filename
                  normalized = raw_name.replace("\\", "/")
                  trimmed = normalized.rstrip("/")
                  member = PurePosixPath(trimmed)
                  mode = (info.external_attr >> 16) & 0o170000
                  parts = trimmed.split("/")

                  if (
                      not trimmed
                      or "\x00" in normalized
                      or normalized.startswith("/")
                      or member.is_absolute()
                      or any(part in ("", ".", "..") for part in parts)
                      or (len(trimmed) > 1 and trimmed[1] == ":")
                      or parts[0] == ".git"
                  ):
                      raise SystemExit(f"Unsafe archive path rejected: {raw_name!r}")
                  if mode == stat.S_IFLNK:
                      raise SystemExit(f"Symlink entry rejected: {raw_name!r}")

                  target = (root / Path(*member.parts)).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f"Path escapes repository root: {raw_name!r}")

                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue

                  target.parent.mkdir(parents=True, exist_ok=True)
                  with zf.open(info) as src, target.open("wb") as dst:
                      while chunk := src.read(1024 * 1024):
                          dst.write(chunk)

          print(
              f"Safely extracted {len(members)} entries "
              f"({total_size} uncompressed bytes)."
          )
          PY

          rm -f -- "${ARCHIVE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Archive produced no repository changes; nothing to commit."
            exit 0
          fi

          git commit -m "chore: safely extract uploaded archive"
          git push origin "HEAD:${GITHUB_REF_NAME}"
