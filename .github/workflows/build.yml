name: Build Portable Android 13 (LineageOS 20 GApps x86_64)

on:
  workflow_dispatch:
    inputs:
      lineage_gsi_url:
        description: "Optional direct URL for LineageOS 20.0 GApps x86_64 system image (.img/.xz/.zip)"
        required: false
        default: ""
      bliss_iso_url:
        description: "Optional direct URL for Bliss OS 16.9 (Android 13 / API 33) x86_64 ISO"
        required: false
        default: ""
      ksu_kernel_url:
        description: "Optional direct URL for prebuilt x86_64 KernelSU Next bzImage"
        required: false
        default: ""
  push:
    tags:
      - "v*"
    branches:
      - main

permissions:
  contents: write

env:
  BUNDLE_DIR: dist_bundle
  ARCHIVE_PATH: dist/Portable_Android13_Win11.7z

jobs:
  build-windows-launcher:
    name: Build Native AndroidLauncher.exe (Windows 11 / Python 3.11)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set Up Python 3.11 (Native Windows x64)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-win.txt

      - name: 3. Install GUI, DnD & PyInstaller Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-win.txt

      - name: 4. Check or Generate Windows App Icon (assets/app.ico)
        shell: pwsh
        run: |
          if (-not (Test-Path "assets/app.ico") -or ((Get-Item "assets/app.ico").Length -eq 0)) {
            python scripts/generate_icon.py assets/app.ico
          }
          if (-not (Test-Path "assets/app.ico")) { throw "assets/app.ico generation failed" }

      - name: 5. Compile Native AndroidLauncher.exe via PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --icon=assets/app.ico `
            --name AndroidLauncher `
            --collect-all customtkinter `
            --collect-all tkinterdnd2 `
            --add-data "src/spoof_device.py;." `
            src/launcher.py
          $exe = Get-Item "dist/AndroidLauncher.exe"
          Write-Host "Built native AndroidLauncher.exe ($($exe.Length) bytes)"
          if ($exe.Length -lt 5242880) { throw "AndroidLauncher.exe is unexpectedly small" }

      - name: 6. Upload Native Launcher Executable (~25 MB)
        uses: actions/upload-artifact@v4
        with:
          name: android-launcher-win64
          path: dist/AndroidLauncher.exe
          if-no-files-found: error
          retention-days: 1

  build-portable-android:
    name: Build Portable Android 13 Bundle (Windows 11 / i5-3475S / HD 4000)
    needs: build-windows-launcher
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Reclaim Runner Disk Space (>= 45 GB Free)
        shell: bash
        run: |
          chmod +x scripts/cleanup_disk.sh
          sudo bash scripts/cleanup_disk.sh

      - name: 3. Install Linux Build, Image & Fallback Packaging Tools
        shell: bash
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            p7zip-full qemu-utils qemu-system-x86 e2fsprogs android-sdk-libsparse-utils \
            squashfs-tools erofs-utils xorriso aria2 curl wget jq ca-certificates \
            python3 python3-pip python3-pil file gawk kmod libncurses-dev \
            bc bison flex libelf-dev libssl-dev build-essential libc6-dev cpio zstd lz4 xz-utils \
            lld clang llvm binutils-x86-64-linux-gnu secilc \
            wine wine64 wine32 winbind xvfb cabextract
          sudo rm -rf /var/lib/apt/lists/*
          df -h /

      - name: 4. Check or Generate Windows App Icon (assets/app.ico)
        shell: bash
        run: |
          if [ -s "assets/app.ico" ]; then
            echo "Found existing assets/app.ico ($(stat -c%s assets/app.ico) bytes); using directly."
          else
            echo "assets/app.ico not found; generating default icon with Pillow..."
            python3 scripts/generate_icon.py assets/app.ico
          fi
          test -s "assets/app.ico"

      - name: 5. Fetch QEMU (WHPX + VirGL + ANGLE), scrcpy, ADB & Spoof Modules
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${BUNDLE_DIR}/bin/scrcpy" "${BUNDLE_DIR}/images/profiles" "${BUNDLE_DIR}/modules" "${BUNDLE_DIR}/assets"
          cp -f assets/app.ico "${BUNDLE_DIR}/assets/app.ico"
          chmod +x scripts/fetch_assets.sh
          bash scripts/fetch_assets.sh "${BUNDLE_DIR}"
          df -h /

      - name: 6. Extract Bliss OS 16.9 (API 33) Base, x86_64 ksud & Build Matched KernelSU Next (ikconfig)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          BLISS_ISO_URL: ${{ github.event.inputs.bliss_iso_url }}
          KSU_KERNEL_URL: ${{ github.event.inputs.ksu_kernel_url }}
        run: |
          chmod +x scripts/build_ksu_kernel.sh
          sudo -E bash scripts/build_ksu_kernel.sh "${BUNDLE_DIR}"
          df -h /

      - name: 7. Patch LineageOS 20.0 GApps (API 33), Build Dual Initrd & Pre-Format 16GB ext4 Data
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          LINEAGE_GSI_URL: ${{ github.event.inputs.lineage_gsi_url }}
        run: |
          chmod +x scripts/patch_system_img.sh
          sudo -E bash scripts/patch_system_img.sh "${BUNDLE_DIR}"
          RAW_DATA="/tmp/data_clean.raw"
          rm -f "${RAW_DATA}" "${BUNDLE_DIR}/images/data.img" "${BUNDLE_DIR}/images/data_clean.qcow2"
          truncate -s 16G "${RAW_DATA}"
          mkfs.ext4 -F -L data "${RAW_DATA}"
          DATA_MNT="/tmp/data_clean_mnt"
          DATA_CTX=$(cat /tmp/data_root_secontext 2>/dev/null || echo "u:object_r:system_data_root_file:s0")
          rm -rf "${DATA_MNT}" && mkdir -p "${DATA_MNT}"
          sudo mount -o loop "${RAW_DATA}" "${DATA_MNT}"
          sudo python3 -c 'import os, sys; os.setxattr(sys.argv[1], b"security.selinux", sys.argv[2].encode("utf-8") + b"\x00", follow_symlinks=False)' "${DATA_MNT}" "${DATA_CTX}"
          sudo sync
          sudo umount "${DATA_MNT}" || sudo umount -lf "${DATA_MNT}" || true
          rm -rf "${DATA_MNT}"
          sudo rm -f /tmp/data_root_secontext
          e2fsck -f -y "${RAW_DATA}" || true
          qemu-img convert -c -O qcow2 "${RAW_DATA}" "${BUNDLE_DIR}/images/data_clean.qcow2"
          cp -f "${BUNDLE_DIR}/images/data_clean.qcow2" "${BUNDLE_DIR}/images/data.img"
          rm -f "${RAW_DATA}"
          df -h /

      - name: 7b. QEMU IvyBridge Full Android Boot & Network Smoke Test (stock + KernelSU)
        shell: bash
        run: |
          set -Eeuo pipefail
          SMOKE_FAIL=0
          BOOT_TIMEOUT_SECONDS=900
          SOAK_SECONDS=90
          BOOT_MARKER='[PORTABLE-BOOT] BOOT_COMPLETED=1'
          FAIL_RE='\[INIT-WRAPPER\] FATAL:|Kernel panic - not syncing|InitFatalReboot|Init encountered errors|Attempted to kill init|reboot: Restarting system|has incorrect label or no domain transition|vrend_decode_ctx_submit_cmd|Illegal command buffer'
          GFX_FAIL_RE="Service 'vendor\.hwcomposer[^']*' exited with status [1-9]|Service 'surfaceflinger' exited with status [1-9]|surfaceflinger.*killed by signal 9"

          run_boot_smoke() {
            local KNAME="$1"
            local INAME="$2"
            local LOGF="/tmp/ci_smoke_${KNAME}.log"
            local DBGF="/tmp/ci_qemu_debug_${KNAME}.log"
            local OUTF="/tmp/ci_qemu_out_${KNAME}.log"
            local QPID=""
            local BOOT_OK=0
            local FAILURE=""
            local ELAPSED=0
            local SOAK_ELAPSED=0

            rm -f "${LOGF}" "${DBGF}" "${OUTF}"
            echo "=== Full Android boot: ${KNAME} + ${INAME}; TCG IvyBridge; SELinux Enforcing; E1000; software VirtIO display ==="

            qemu-system-x86_64 \
              -name "CI-Smoke-${KNAME}" \
              -no-reboot -snapshot \
              -machine pc,hpet=off \
              -smp 2,cores=2,threads=1,sockets=1 \
              -m 2048 \
              -accel tcg,thread=multi \
              -cpu IvyBridge,-ht,-tsc-deadline,+ssse3,+sse4.1,+sse4.2,+popcnt \
              -device virtio-rng-pci \
              -vga none -device virtio-vga -display none \
              -netdev user,id=net0 \
              -device e1000,netdev=net0 \
              -drive file="${BUNDLE_DIR}/images/system.img",if=virtio,format=qcow2,readonly=on \
              -drive file="${BUNDLE_DIR}/images/vendor.img",if=virtio,format=qcow2,readonly=on \
              -drive file="${BUNDLE_DIR}/images/data.img",if=virtio,format=qcow2 \
              -kernel "${BUNDLE_DIR}/images/${KNAME}" \
              -initrd "${BUNDLE_DIR}/images/${INAME}" \
              -append "root=/dev/ram0 androidboot.hardware=android_x86_64 androidboot.selinux=enforcing HWACCEL=0 MESA_LLVMPIPE=1 EGL=mesa HWC_HIDL=drmfb DATA=/dev/vdc androidboot.console=ttyS0 printk.devkmsg=on printk.always_kmsg_dump=1 nokaslr panic=0 earlycon=uart8250,io,0x3f8,115200 earlyprintk=serial,ttyS0,115200,keep console=ttyS0,115200 SERIAL=ttyS0 loglevel=7" \
              -serial "file:${LOGF}" \
              -d guest_errors,cpu_reset -D "${DBGF}" >"${OUTF}" 2>&1 &
            QPID=$!

            # Stage 2 and SurfaceFlinger startup are not success criteria. Wait for
            # Android's own sys.boot_completed property, mirrored into serial/kmsg.
            for ((ELAPSED=0; ELAPSED<BOOT_TIMEOUT_SECONDS; ELAPSED+=2)); do
              if ! kill -0 "${QPID}" 2>/dev/null; then
                FAILURE="QEMU exited before Android reported BOOT_COMPLETED"
                break
              fi
              if grep -qE "Service 'netd'.*exited with status [1-9]" "${LOGF}" 2>/dev/null; then
                FAILURE="netd exited non-zero; Android init restarts zygote on netd failure"
                break
              fi
              if grep -qE "${GFX_FAIL_RE}" "${LOGF}" 2>/dev/null; then
                FAILURE="Graphics HAL or SurfaceFlinger exited non-zero"
                break
              fi
              if grep -qE "${FAIL_RE}" "${LOGF}" 2>/dev/null; then
                FAILURE="Fatal init/kernel/graphics marker detected"
                break
              fi
              if grep -Fq "${BOOT_MARKER}" "${LOGF}" 2>/dev/null; then
                BOOT_OK=1
                break
              fi
              sleep 2
            done

            # A boot-complete event alone is insufficient: catch delayed netd/HWC/SF loops.
            if [ "${BOOT_OK}" -eq 1 ] && [ -z "${FAILURE}" ]; then
              if ! grep -qE 'e1000 .*eth0:' "${LOGF}"; then
                FAILURE="The guest did not register the configured E1000 device as eth0"
              fi
            fi

            if [ "${BOOT_OK}" -eq 1 ] && [ -z "${FAILURE}" ]; then
              echo "Android reported BOOT_COMPLETED after ${ELAPSED}s; E1000 eth0 is present; starting ${SOAK_SECONDS}s stability soak."
              while [ "${SOAK_ELAPSED}" -lt "${SOAK_SECONDS}" ]; do
                if ! kill -0 "${QPID}" 2>/dev/null; then
                  FAILURE="QEMU exited during post-boot stability soak"
                  break
                fi
                if grep -qE "Service 'netd'.*exited with status [1-9]" "${LOGF}"; then
                  FAILURE="netd exited during post-boot stability soak"
                  break
                fi
                if grep -qE "${GFX_FAIL_RE}" "${LOGF}"; then
                  FAILURE="Graphics HAL or SurfaceFlinger exited during post-boot stability soak"
                  break
                fi
                if grep -qE "${FAIL_RE}" "${LOGF}"; then
                  FAILURE="Fatal marker detected during post-boot stability soak"
                  break
                fi
                sleep 5
                SOAK_ELAPSED=$((SOAK_ELAPSED + 5))
              done
            fi

            kill "${QPID}" 2>/dev/null || true
            wait "${QPID}" 2>/dev/null || true

            echo "--- Android boot, network and graphics diagnostics (${KNAME}) ---"
            grep -iE 'PORTABLE-BOOT|init second stage|PORTABLE-GFX|netd|zygote|surfaceflinger|bootanim|e1000|eth0|dhcp|bpfloader|panic|FATAL|exited with status' "${LOGF}" 2>/dev/null | tail -n 120 || true
            echo "--- Tail of serial log ---"
            tail -n 80 "${LOGF}" 2>/dev/null || true
            echo "--- QEMU stderr ---"
            cat "${OUTF}" 2>/dev/null || true
            echo "--- QEMU guest_errors/cpu_reset ---"
            tail -n 60 "${DBGF}" 2>/dev/null || true

            if [ "${BOOT_OK}" -ne 1 ] && [ -z "${FAILURE}" ]; then
              FAILURE="Android did not report BOOT_COMPLETED within ${BOOT_TIMEOUT_SECONDS}s"
            fi
            if [ "${SOAK_ELAPSED}" -lt "${SOAK_SECONDS}" ] && [ -z "${FAILURE}" ]; then
              FAILURE="Post-boot stability soak did not finish"
            fi
            if [ -n "${FAILURE}" ]; then
              echo "ERROR: ${KNAME} full-boot smoke test failed: ${FAILURE}" >&2
              SMOKE_FAIL=1
              return 0
            fi
            echo "PASSED: ${KNAME} reached sys.boot_completed and survived ${SOAK_SECONDS}s without netd/HWC/SF failure."
          }

          run_boot_smoke "kernel_ksunext" "initrd_ksunext.img"
          run_boot_smoke "kernel_stock" "initrd_stock.img"
          test "${SMOKE_FAIL}" -eq 0

      - name: 8a. Download Native Windows AndroidLauncher.exe
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-launcher-win64
          path: dist_bundle

      - name: 8b. Verify AndroidLauncher.exe (Auto-Fallback to Wine Builder if Missing)
        shell: bash
        run: |
          EXE_PATH="${BUNDLE_DIR}/AndroidLauncher.exe"
          EXE_SIZE=$(stat -c%s "${EXE_PATH}" 2>/dev/null || echo 0)
          if [ "${EXE_SIZE}" -ge 5242880 ]; then
            echo "Using native Windows-compiled AndroidLauncher.exe (${EXE_SIZE} bytes)."
          else
            echo "Native AndroidLauncher.exe not present; falling back to Wine PyInstaller build..."
            chmod +x scripts/build_exe_wine.sh
            bash scripts/build_exe_wine.sh "${BUNDLE_DIR}"
          fi
          cp -f README.md "${BUNDLE_DIR}/README_WINDOWS.txt"

      - name: 9. Verify Bundle & Ultra-Solid 7z Compression (< 1.95 GB Single File)
        shell: bash
        run: |
          echo "=== Verifying Portable Bundle Contents ==="
          test -s "${BUNDLE_DIR}/AndroidLauncher.exe"
          test -s "${BUNDLE_DIR}/bin/qemu-system-x86_64.exe"
          test -s "${BUNDLE_DIR}/bin/qemu-img.exe"
          test -s "${BUNDLE_DIR}/bin/adb.exe"
          test -s "${BUNDLE_DIR}/bin/scrcpy/scrcpy.exe"
          test -s "${BUNDLE_DIR}/images/kernel_stock"
          test -s "${BUNDLE_DIR}/images/kernel_ksunext"
          test -s "${BUNDLE_DIR}/images/initrd.img"
          test -s "${BUNDLE_DIR}/images/initrd_stock.img"
          test -s "${BUNDLE_DIR}/images/initrd_ksunext.img"
          test -s "${BUNDLE_DIR}/images/vendor.img"
          test -s "${BUNDLE_DIR}/images/system.img"
          test -s "${BUNDLE_DIR}/images/data.img"
          test -s "${BUNDLE_DIR}/images/data_clean.qcow2"
          test -s "${BUNDLE_DIR}/modules/KernelSU_Next.apk"
          test -s "${BUNDLE_DIR}/modules/Portable_Stealth_KSU.zip"

          ls -lh "${BUNDLE_DIR}/images"

          mkdir -p dist
          rm -f dist/Portable_Android13_Win11.7z*

          echo "Compressing with 7z Ultra Solid LZMA2 (128MB dictionary)..."
          7z a -t7z -mx=9 -m0=lzma2 -md=128m -ms=on -mmt=on "${ARCHIVE_PATH}" "./${BUNDLE_DIR}/"*

          ARCHIVE_BYTES=$(stat -c%s "${ARCHIVE_PATH}")
          LIMIT_BYTES=$((1950 * 1024 * 1024))
          echo "Single archive size: ${ARCHIVE_BYTES} bytes (Limit: ${LIMIT_BYTES} bytes)"

          if [ "${ARCHIVE_BYTES}" -gt "${LIMIT_BYTES}" ]; then
            echo "WARNING: Archive exceeded 1.95 GB GitHub Release safety threshold; splitting into 1900m volumes..."
            rm -f "${ARCHIVE_PATH}"
            7z a -t7z -mx=9 -m0=lzma2 -md=128m -ms=on -mmt=on -v1900m "${ARCHIVE_PATH}" "./${BUNDLE_DIR}/"*
          else
            echo "OK: Single-file archive is safely under 1.95 GB."
          fi

          ls -lh dist/
          (cd dist && sha256sum Portable_Android13_Win11.7z* > Portable_Android13_Win11.sha256)

      - name: 10. Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}"
          name: "Portable Android 13 Win11 (Build #${{ github.run_number }})"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/Portable_Android13_Win11.7z*
            dist/Portable_Android13_Win11.sha256
            
